name: CLI compatibility

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-compatibility
  cancel-in-progress: true

jobs:
  stable-cli-smoke:
    name: Latest stable CLI smoke (${{ matrix.opencode_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - opencode_label: OpenCode 1.18
            opencode_package: opencode-ai@1.18.32
          - opencode_label: OpenCode 2
            opencode_package: "@opencode/cli@latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install latest stable CLIs
        run: |
          npm install --global \
            @openai/codex@latest \
            @anthropic-ai/claude-code@latest \
            "${{ matrix.opencode_package }}" \
            @earendil-works/pi-coding-agent@latest

      - name: Run capability smoke tests
        run: npm run smoke:cli-compat
